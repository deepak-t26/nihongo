<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanji and Hiragana Practice</title>
<style>
/* ...existing styles from index.html... */
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div id="counter">0 / 0</div>
    <div id="status">Loading...</div>
  </div>
  <div id="content" class="loading">
    Loading practice...
  </div>
</div>
<script>
let questions = [];
let currentQuestion = 0;
let correctAnswers = 0;

async function loadQuestions() {
  try {
    const data = await fetch("res/kanji_hiragana.json").then(r => r.json());
    questions = data;
    shuffle(questions);
    showQuestion();
  } catch (err) {
    document.getElementById("content").innerHTML = "<h2>Unable to load questions.</h2>";
  }
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function showQuestion() {
  if (questions.length === 0) {
    document.getElementById("content").innerHTML = "No questions available.";
    return;
  }

  const q = questions[currentQuestion];
  document.getElementById("counter").textContent = `${currentQuestion + 1} / ${questions.length}`;
  document.getElementById("content").innerHTML = `
    <div class="question">${q.kanji}</div>
    <div class="buttons">
      ${q.options.map((option, index) => `<button onclick="checkAnswer(${index})">${option}</button>`).join("")}
    </div>
  `;
}

function checkAnswer(selectedIndex) {
  const q = questions[currentQuestion];
  if (q.correctIndex === selectedIndex) {
    correctAnswers++;
  }
  currentQuestion++;
  if (currentQuestion >= questions.length) {
    showResults();
  } else {
    showQuestion();
  }
}

function showResults() {
  document.getElementById("content").innerHTML = `
    <h2>Results</h2>
    <p>You answered ${correctAnswers} out of ${questions.length} correctly.</p>
    <button onclick="location.reload()">Retry</button>
  `;
}

loadQuestions();
</script>
</body>
</html>
